name: Gerar APK

# Roda quando você envia código, e também no botão manual da aba Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala o SDK do Android na máquina do GitHub. É x86_64, então
      # as build-tools oficiais funcionam sem gambiarra — que é
      # exatamente o problema que a gente evita não compilando no celular.
      - name: Instalar o SDK do Android
        uses: android-actions/setup-android@v3

      # Versão fixada: o AGP 8.5.2 não suporta Gradle 9.
      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Salva o log num arquivo pra poder filtrar depois, e ainda mostra
      # tudo na tela normalmente.
      - name: Compilar o APK de debug
        id: compilar
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      # Se falhou, imprime SÓ os erros do Kotlin, num bloco curto que dá
      # pra ler e copiar do celular sem rolar log de mil linhas.
      - name: Erros de compilação
        if: steps.compilar.outcome == 'failure'
        run: |
          echo "=================================================="
          echo "         ERROS ENCONTRADOS — COPIE DAQUI"
          echo "=================================================="
          echo ""
          grep -E "^e: |^w: .*error|error:" build.log \
            | sed 's|file:///home/runner/work/[^/]*/[^/]*/||' \
            | sort -u \
            | head -60
          echo ""
          echo "=================================================="
          echo "Total de erros:"
          grep -c "^e: " build.log || echo "0"
          echo "=================================================="
          echo ""
          echo "--- Tarefa que falhou ---"
          grep -E "^> Task .*FAILED|^FAILURE:|What went wrong" -A4 build.log | head -25
          exit 1

      # Guarda o log completo como anexo, caso o filtro não pegue algo.
      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      # Fica disponível na aba Actions, dentro da execução, por 90 dias.
      # Baixa como .zip — qualquer gerenciador de arquivos do Android abre.
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: FManager-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # Publica também como release, que baixa direto em um toque,
      # sem precisar descompactar nada no celular.
      - name: Publicar como release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FManager build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
